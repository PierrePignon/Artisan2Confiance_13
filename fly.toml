# fly.toml app configuration file generated for espace-chantier-adc13 on 2026-09-07T21:21:03+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'espace-chantier-adc13'
primary_region = 'cdg'

[build]
[env]
  DATA_DIR = '/data'
  PORT = '3000'

[[mounts]]
  source = 'espace_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
