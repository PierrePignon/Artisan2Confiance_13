name: Deploy to Fly.io
# Déploiement automatique à chaque push sur main (le "git push = déploiement").
# Pré-requis : ajouter le secret FLY_API_TOKEN dans GitHub (Settings → Secrets → Actions).
#   Génère-le avec :  fly tokens create deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
